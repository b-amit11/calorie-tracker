name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: "file:/tmp/ci.db"

  scale:
    name: Scale (Swift build + tests)
    runs-on: macos-15
    defaults:
      run:
        working-directory: scale-helper
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: scale-helper/.build
          key: spm-${{ runner.os }}-${{ hashFiles('scale-helper/Package.resolved') }}
      - run: swift --version
      - run: swift build
      - run: swift test
